<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2048</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
  <header class="header">
    <h1 class="title">2048</h1>
    <div class="scores">
      <div class="score-box">
        <span class="score-label">SCORE</span>
        <span class="score-value" id="score">0</span>
      </div>
      <div class="score-box">
        <span class="score-label">BEST</span>
        <span class="score-value" id="best">0</span>
      </div>
    </div>
  </header>

  <div class="controls">
    <p class="instructions">방향키 또는 스와이프로 타일을 움직여 합쳐보세요. 2048을 만들면 승리!</p>
    <button id="restart-btn" class="btn">New Game</button>
  </div>

  <div class="board-wrapper">
    <div class="board" id="board">
      <div class="grid-cells" id="grid-cells"></div>
      <div class="tile-layer" id="tile-layer"></div>

      <div class="overlay" id="overlay" hidden>
        <p class="overlay-message" id="overlay-message"></p>
        <div class="overlay-buttons">
          <button id="overlay-continue-btn" class="btn" hidden>계속하기</button>
          <button id="overlay-restart-btn" class="btn">Restart</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>

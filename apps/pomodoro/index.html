<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뽀모도로 타이머</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="mode-work">
<div class="app-container">
  <header class="header">
    <p class="session-label" id="session-label">집중 시간</p>
    <p class="session-count" id="session-count">0번째 뽀모도로 완료</p>
  </header>

  <div class="timer-display">
    <span id="time-display">25:00</span>
  </div>

  <div class="controls">
    <button id="toggle-btn" class="btn btn-primary">시작</button>
    <button id="reset-btn" class="btn btn-secondary">리셋</button>
  </div>

  <div class="sliders">
    <div class="slider-group">
      <div class="slider-label-row">
        <label for="work-slider">집중 시간</label>
        <span id="work-value">25분</span>
      </div>
      <input type="range" id="work-slider" min="5" max="60" step="1" value="25">
    </div>

    <div class="slider-group">
      <div class="slider-label-row">
        <label for="break-slider">쉬는 시간</label>
        <span id="break-value">5분</span>
      </div>
      <input type="range" id="break-slider" min="1" max="30" step="1" value="5">
    </div>
  </div>
</div>

<script src="timer.js"></script>
</body>
</html>
